name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the plugin marketplace
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict
      - name: Check the scan checker runs
        run: |
          python3 -m py_compile skills/*/*.py dev/*/*.py
          printf 'Use environment variables.\n' | python3 skills/at-a-glance/scan_check.py -
      - name: Test the ui-states checker
        run: python3 dev/ui-states/tests/run_tests.py
